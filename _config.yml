# Site settings
locale: "en-US"
title: "Yun Deng"
title_separator: "-"
name: "Yun Deng"
description: "Yun Deng - Postdoc at Stanford University"
url: "https://YunDeng98.github.io"
baseurl: ""
repository: "YunDeng98/YunDeng98.github.io"

minimal_mistakes_skin: "dark"
search: false

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/Los_Angeles

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author sidebar
author:
  name: "Yun Deng"
  avatar: "/assets/images/profile.jpeg"
  bio: "Computational population geneticist"
  location: "Stanford, CA"
  email: "yundeng@stanford.edu"
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=wi192nQAAAAJ&hl=en"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0003-2802-2546"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YunDeng98"
    - label: "Bluesky"
      icon: "fab fa-fw fa-bluesky"
      url: "https://bsky.app/profile/yundeng.bsky.social"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YunDeng98"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=wi192nQAAAAJ&hl=en"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
